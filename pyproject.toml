[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-fanout-pipeline"
version = "0.1.0"
description = "Parallel multi-model LLM fan-out with strict JSON enforcement, retry-repair and fallback aggregation"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["llm_fanout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
